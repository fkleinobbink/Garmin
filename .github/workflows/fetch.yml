name: Fetch URLs
on:
  push:
    paths: ["fetch/requests/**"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p fetch/out
          for f in fetch/requests/*.sh; do bash "$f" || true; rm "$f"; done
      - name: Commit
        run: |
          git config user.name fetch-bot; git config user.email fetch-bot@users.noreply.github.com
          git add -A fetch
          git diff --cached --quiet || git commit -m "fetch $(date -u +%FT%TZ)"
          git pull --rebase -q && git push -q
